services:
  personal-api:
    image: akuan09/personal-api:latest
    container_name: personal-api
    volumes:
      - ./personal-api-data.json:/usr/src/app/data.json
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personal-api.rule=Host(`personal-api.asd9.fun`)"
      - "traefik.http.routers.personal-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.personal-api.loadbalancer.server.port=3000"
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
